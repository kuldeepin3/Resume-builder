 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-height: 80vh;
            overflow-y: auto;
        }

        .preview-section {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        h2 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .add-btn {
            background: #2ecc71;
            margin-top: 10px;
        }

        .add-btn:hover {
            background: #27ae60;
        }

        .remove-btn {
            background: #e74c3c;
        }

        .remove-btn:hover {
            background: #c0392b;
        }

        .download-btn {
            background: #9b59b6;
            margin-top: 15px;
        }

        .download-btn:hover {
            background: #8e44ad;
        }

        .template-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .template-btn {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 12px;
            border: 2px solid #3498db;
            border-radius: 5px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .template-btn:hover {
            background: #f8f9fa;
        }

        .template-btn.active {
            background: #3498db;
            color: white;
            border-color: #2980b9;
        }

        .template-btn i {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }

        /* Template 1: Modern Minimalist */
        .template-modern {
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            background: white;
            color: #2c3e50;
            padding: 30px;
            border-left: 5px solid #3498db;
        }

        .template-modern .resume-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 2px solid #ecf0f1;
        }

        .template-modern .resume-header h2 {
            font-size: 32px;
            color: #2c3e50;
            border: none;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .template-modern .resume-header .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            font-size: 15px;
        }

        .template-modern .section-title {
            color: #3498db;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #3498db;
            display: inline-block;
        }

        .template-modern .experience-item, .template-modern .education-item {
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid #ecf0f1;
        }

        .template-modern .job-title {
            font-weight: bold;
            color: #2c3e50;
            font-size: 18px;
        }

        .template-modern .company {
            font-style: italic;
            color: #7f8c8d;
            margin: 5px 0;
        }

        .template-modern .date {
            color: #95a5a6;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .template-modern .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .template-modern .skill {
            background: #ecf0f1;
            color: #2c3e50;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        /* Template 2: Professional Dark */
        .template-professional {
            font-family: 'Lato', 'Segoe UI', sans-serif;
            background: #2c3e50;
            color: #ecf0f1;
            padding: 30px;
        }

        .template-professional .resume-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 1px solid #34495e;
        }

        .template-professional .resume-header h2 {
            font-size: 32px;
            color: #ecf0f1;
            border: none;
            margin-bottom: 10px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .template-professional .resume-header .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
            font-size: 15px;
            color: #bdc3c7;
        }

        .template-professional .section-title {
            color: #3498db;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px;
            padding-bottom: 8px;
            border-bottom: 1px solid #34495e;
            display: inline-block;
        }

        .template-professional .experience-item, .template-professional .education-item {
            margin-bottom: 20px;
            padding-left: 15px;
            border-left: 3px solid #34495e;
        }

        .template-professional .job-title {
            font-weight: bold;
            color: #ecf0f1;
            font-size: 18px;
        }

        .template-professional .company {
            font-style: italic;
            color: #bdc3c7;
            margin: 5px 0;
        }

        .template-professional .date {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .template-professional .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .template-professional .skill {
            background: #34495e;
            color: #ecf0f1;
            padding: 6px 15px;
            border-radius: 3px;
            font-size: 14px;
        }

        .template-professional a {
            color: #3498db;
        }

        .resume-preview {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 5px;
        }

        .preview-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .template-btn {
                min-width: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-file-alt"></i>Resume Builder</h1>
            <p class="tagline">Create resumes with unique templates</p>
        </header>

        <div class="template-selector">
            <div class="template-btn active" data-template="modern">
                <i class="fas fa-minimize"></i>
                <span>Modern Minimalist</span>
            </div>
            <div class="template-btn" data-template="professional">
                <i class="fas fa-briefcase"></i>
                <span>Professional Dark</span>
            </div>
        </div>

        <div class="main-content">
            <div class="form-section">
                <h2><i class="fas fa-user-edit"></i> Personal Information</h2>
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="john@example.com">
                </div>
                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" placeholder="(123) 456-7890">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="123 Main St, City, Country">
                </div>
                <div class="form-group">
                    <label for="linkedin">LinkedIn Profile</label>
                    <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
                </div>
                <div class="form-group">
                    <label for="github">GitHub Profile</label>
                    <input type="url" id="github" placeholder="https://github.com/yourusername">
                </div>

                <h2><i class="fas fa-star"></i> Professional Summary</h2>
                <div class="form-group">
                    <textarea id="summary" placeholder="Experienced professional with skills in..."></textarea>
                </div>

                <h2><i class="fas fa-briefcase"></i> Work Experience</h2>
                <div id="experience-container">
                    <div class="experience-form">
                        <div class="form-group">
                            <label for="jobTitle1">Job Title</label>
                            <input type="text" id="jobTitle1" placeholder="Software Developer">
                        </div>
                        <div class="form-group">
                            <label for="company1">Company</label>
                            <input type="text" id="company1" placeholder="Tech Inc.">
                        </div>
                        <div class="form-group">
                            <label for="jobStartDate1">Start Date</label>
                            <input type="text" id="jobStartDate1" placeholder="June 2020">
                        </div>
                        <div class="form-group">
                            <label for="jobEndDate1">End Date</label>
                            <input type="text" id="jobEndDate1" placeholder="Present">
                        </div>
                        <div class="form-group">
                            <label for="jobDescription1">Description</label>
                            <textarea id="jobDescription1" placeholder="Responsibilities and achievements..."></textarea>
                        </div>
                    </div>
                </div>
                <button class="add-btn action-btn" id="add-experience"><i class="fas fa-plus"></i> Add Another Experience</button>

                <h2><i class="fas fa-graduation-cap"></i> Education</h2>
                <div id="education-container">
                    <div class="education-form">
                        <div class="form-group">
                            <label for="degree1">Degree</label>
                            <input type="text" id="degree1" placeholder="Bachelor of Science in Computer Science">
                        </div>
                        <div class="form-group">
                            <label for="school1">School</label>
                            <input type="text" id="school1" placeholder="University of Technology">
                        </div>
                        <div class="form-group">
                            <label for="educationStartDate1">Start Date</label>
                            <input type="text" id="educationStartDate1" placeholder="September 2016">
                        </div>
                        <div class="form-group">
                            <label for="educationEndDate1">End Date</label>
                            <input type="text" id="educationEndDate1" placeholder="May 2020">
                        </div>
                    </div>
                </div>
                <button class="add-btn action-btn" id="add-education"><i class="fas fa-plus"></i> Add Another Education</button>

                <h2><i class="fas fa-tools"></i> Skills</h2>
                <div id="skills-container">
                    <div class="form-group">
                        <input type="text" id="skill1" placeholder="JavaScript">
                    </div>
                </div>
                <button class="add-btn action-btn" id="add-skill"><i class="fas fa-plus"></i> Add Another Skill</button>

                <h2><i class="fas fa-project-diagram"></i> Projects</h2>
                <div id="projects-container">
                    <div class="project-form">
                        <div class="form-group">
                            <label for="projectName1">Project Name</label>
                            <input type="text" id="projectName1" placeholder="E-commerce Website">
                        </div>
                        <div class="form-group">
                            <label for="projectDescription1">Description</label>
                            <textarea id="projectDescription1" placeholder="Details about the project..."></textarea>
                        </div>
                    </div>
                </div>
                <button class="add-btn action-btn" id="add-project"><i class="fas fa-plus"></i> Add Another Project</button>
            </div>

            <div class="preview-section">
                <h2>Resume Preview</h2>
                <button class="download-btn action-btn" id="download-pdf"><i class="fas fa-download"></i> Download PDF</button>
                <div class="resume-preview template-modern" id="resume-preview">
                    </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Function to update the resume preview
            function updateResumePreview() {
                const resumePreview = document.getElementById('resume-preview');
                const template = document.querySelector('.template-btn.active').getAttribute('data-template');
                
                resumePreview.className = 'resume-preview template-' + template;

                // Personal Information
                const fullName = document.getElementById('fullName').value || 'Your Name';
                const email = document.getElementById('email').value || '';
                const phone = document.getElementById('phone').value || '';
                const address = document.getElementById('address').value || '';
                const linkedin = document.getElementById('linkedin').value;
                const github = document.getElementById('github').value;
                
                // Professional Summary
                const summary = document.getElementById('summary').value;
                
                // Work Experience
                let experiencesHTML = '';
                document.querySelectorAll('#experience-container .experience-form').forEach(form => {
                    const jobTitle = form.querySelector('input[id^="jobTitle"]').value || '';
                    const company = form.querySelector('input[id^="company"]').value || '';
                    const jobStartDate = form.querySelector('input[id^="jobStartDate"]').value || '';
                    const jobEndDate = form.querySelector('input[id^="jobEndDate"]').value || '';
                    const jobDescription = form.querySelector('textarea[id^="jobDescription"]').value || '';
                    
                    if (jobTitle || company || jobDescription) {
                        experiencesHTML += `
                            <div class="experience-item">
                                <div class="job-title">${jobTitle}</div>
                                <div class="company">${company}</div>
                                <div class="date">${jobStartDate} - ${jobEndDate}</div>
                                <div class="job-description">${jobDescription}</div>
                            </div>
                        `;
                    }
                });
                
                // Education
                let educationHTML = '';
                document.querySelectorAll('#education-container .education-form').forEach(form => {
                    const degree = form.querySelector('input[id^="degree"]').value || '';
                    const school = form.querySelector('input[id^="school"]').value || '';
                    const educationStartDate = form.querySelector('input[id^="educationStartDate"]').value || '';
                    const educationEndDate = form.querySelector('input[id^="educationEndDate"]').value || '';
                    
                    if (degree || school) {
                        educationHTML += `
                            <div class="education-item">
                                <div class="degree">${degree}</div>
                                <div class="school">${school}</div>
                                <div class="date">${educationStartDate} - ${educationEndDate}</div>
                            </div>
                        `;
                    }
                });
                
                // Skills
                let skillsHTML = '';
                document.querySelectorAll('#skills-container input[type="text"]').forEach(input => {
                    const skill = input.value;
                    if (skill) {
                        skillsHTML += `<span class="skill">${skill}</span>`;
                    }
                });
                
                // Projects
                let projectsHTML = '';
                document.querySelectorAll('#projects-container .project-form').forEach(form => {
                    const projectName = form.querySelector('input[id^="projectName"]').value || '';
                    const projectDescription = form.querySelector('textarea[id^="projectDescription"]').value || '';
                    
                    if (projectName || projectDescription) {
                        projectsHTML += `
                            <div class="project-item">
                                <div class="project-name"><strong>${projectName}</strong></div>
                                <div class="project-description">${projectDescription}</div>
                            </div>
                        `;
                    }
                });
                
                // Social Links
                let contactInfoHTML = '';
                if (address || phone || email || linkedin || github) {
                    contactInfoHTML = `<div class="contact-info">`;
                    if (address) contactInfoHTML += `<p>${address}</p>`;
                    if (phone) contactInfoHTML += `<p>${phone}</p>`;
                    if (email) contactInfoHTML += `<p>${email}</p>`;
                    let socialLinks = '';
                    if (linkedin) socialLinks += `<a href="${linkedin}" target="_blank">LinkedIn</a>`;
                    if (github) {
                        if (socialLinks) socialLinks += ' | ';
                        socialLinks += `<a href="${github}" target="_blank">GitHub</a>`;
                    }
                    if (socialLinks) contactInfoHTML += `<p>${socialLinks}</p>`;
                    contactInfoHTML += `</div>`;
                }

                // Build the resume preview based on the current template
                resumePreview.innerHTML = `
                    <div class="resume-header">
                        <h2>${fullName}</h2>
                        ${contactInfoHTML}
                    </div>
                    
                    ${summary.trim() ? `
                    <div class="section-title">PROFESSIONAL SUMMARY</div>
                    <p>${summary}</p>
                    ` : ''}
                    
                    ${experiencesHTML.trim() ? `
                    <div class="section-title">WORK EXPERIENCE</div>
                    ${experiencesHTML}
                    ` : ''}
                    
                    ${educationHTML.trim() ? `
                    <div class="section-title">EDUCATION</div>
                    ${educationHTML}
                    ` : ''}
                    
                    ${skillsHTML.trim() ? `
                    <div class="section-title">SKILLS</div>
                    <div class="skills-list">
                        ${skillsHTML}
                    </div>
                    ` : ''}
                    
                    ${projectsHTML.trim() ? `
                    <div class="section-title">PROJECTS</div>
                    ${projectsHTML}
                    ` : ''}
                `;
            }

            // Function to add event listeners to newly created fields
            function addEventListeners(element) {
                const inputs = element.querySelectorAll('input, textarea');
                inputs.forEach(input => {
                    input.addEventListener('input', updateResumePreview);
                });
            }

            // Template selection
            const templateButtons = document.querySelectorAll('.template-btn');
            templateButtons.forEach(button => {
                button.addEventListener('click', function() {
                    templateButtons.forEach(btn => btn.classList.remove('active'));
                    this.classList.add('active');
                    updateResumePreview();
                });
            });
            
            // Add experience field
            document.getElementById('add-experience').addEventListener('click', function() {
                const experienceCount = document.querySelectorAll('.experience-form').length + 1;
                const newExperience = document.createElement('div');
                newExperience.className = 'experience-form';
                newExperience.innerHTML = `
                    <button class="remove-btn remove-experience" data-id="${experienceCount}"><i class="fas fa-times"></i> Remove</button>
                    <div class="form-group">
                        <label for="jobTitle${experienceCount}">Job Title</label>
                        <input type="text" id="jobTitle${experienceCount}" placeholder="Software Developer">
                    </div>
                    <div class="form-group">
                        <label for="company${experienceCount}">Company</label>
                        <input type="text" id="company${experienceCount}" placeholder="Tech Inc.">
                    </div>
                    <div class="form-group">
                        <label for="jobStartDate${experienceCount}">Start Date</label>
                        <input type="text" id="jobStartDate${experienceCount}" placeholder="June 2020">
                    </div>
                    <div class="form-group">
                        <label for="jobEndDate${experienceCount}">End Date</label>
                        <input type="text" id="jobEndDate${experienceCount}" placeholder="Present">
                    </div>
                    <div class="form-group">
                        <label for="jobDescription${experienceCount}">Description</label>
                        <textarea id="jobDescription${experienceCount}" placeholder="Responsibilities and achievements..."></textarea>
                    </div>
                `;
                document.getElementById('experience-container').appendChild(newExperience);
                addEventListeners(newExperience);
                updateResumePreview();
            });
            
            // Add education field
            document.getElementById('add-education').addEventListener('click', function() {
                const educationCount = document.querySelectorAll('.education-form').length + 1;
                const newEducation = document.createElement('div');
                newEducation.className = 'education-form';
                newEducation.innerHTML = `
                    <button class="remove-btn remove-education" data-id="${educationCount}"><i class="fas fa-times"></i> Remove</button>
                    <div class="form-group">
                        <label for="degree${educationCount}">Degree</label>
                        <input type="text" id="degree${educationCount}" placeholder="Bachelor of Science in Computer Science">
                    </div>
                    <div class="form-group">
                        <label for="school${educationCount}">School</label>
                        <input type="text" id="school${educationCount}" placeholder="University of Technology">
                    </div>
                    <div class="form-group">
                        <label for="educationStartDate${educationCount}">Start Date</label>
                        <input type="text" id="educationStartDate${educationCount}" placeholder="September 2016">
                    </div>
                    <div class="form-group">
                        <label for="educationEndDate${educationCount}">End Date</label>
                        <input type="text" id="educationEndDate${educationCount}" placeholder="May 2020">
                    </div>
                `;
                document.getElementById('education-container').appendChild(newEducation);
                addEventListeners(newEducation);
                updateResumePreview();
            });
            
            // Add skill field
            document.getElementById('add-skill').addEventListener('click', function() {
                const skillCount = document.querySelectorAll('#skills-container .form-group').length + 1;
                const newSkill = document.createElement('div');
                newSkill.className = 'form-group';
                newSkill.innerHTML = `
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="skill${skillCount}" placeholder="New Skill">
                        <button class="remove-btn remove-skill" data-id="${skillCount}"><i class="fas fa-times"></i></button>
                    </div>
                `;
                document.getElementById('skills-container').appendChild(newSkill);
                addEventListeners(newSkill);
                updateResumePreview();
            });
            
            // Add project field
            document.getElementById('add-project').addEventListener('click', function() {
                const projectCount = document.querySelectorAll('.project-form').length + 1;
                const newProject = document.createElement('div');
                newProject.className = 'project-form';
                newProject.innerHTML = `
                    <button class="remove-btn remove-project" data-id="${projectCount}"><i class="fas fa-times"></i> Remove</button>
                    <div class="form-group">
                        <label for="projectName${projectCount}">Project Name</label>
                        <input type="text" id="projectName${projectCount}" placeholder="E-commerce Website">
                    </div>
                    <div class="form-group">
                        <label for="projectDescription${projectCount}">Description</label>
                        <textarea id="projectDescription${projectCount}" placeholder="Details about the project..."></textarea>
                    </div>
                `;
                document.getElementById('projects-container').appendChild(newProject);
                addEventListeners(newProject);
                updateResumePreview();
            });
            
            // Remove fields dynamically
            document.addEventListener('click', function(e) {
                if (e.target.classList.contains('remove-experience') || e.target.parentElement.classList.contains('remove-experience')) {
                    const btn = e.target.closest('.remove-experience');
                    if(btn) {
                        btn.parentElement.remove();
                        updateResumePreview();
                    }
                }
                
                if (e.target.classList.contains('remove-education') || e.target.parentElement.classList.contains('remove-education')) {
                    const btn = e.target.closest('.remove-education');
                    if(btn) {
                        btn.parentElement.remove();
                        updateResumePreview();
                    }
                }
                
                if (e.target.classList.contains('remove-skill') || e.target.parentElement.classList.contains('remove-skill')) {
                    const btn = e.target.closest('.remove-skill');
                    if(btn) {
                        btn.parentElement.parentElement.remove();
                        updateResumePreview();
                    }
                }
                
                if (e.target.classList.contains('remove-project') || e.target.parentElement.classList.contains('remove-project')) {
                    const btn = e.target.closest('.remove-project');
                    if(btn) {
                        btn.parentElement.remove();
                        updateResumePreview();
                    }
                }
            });
            
            // Update preview on any input change in the original form fields
            document.querySelectorAll('input, textarea').forEach(element => {
                element.addEventListener('input', updateResumePreview);
            });
            
            // Initial preview update
            updateResumePreview();
            
            // Download PDF
            document.getElementById('download-pdf').addEventListener('click', function() {
                // Final update of the preview before generating the PDF
                updateResumePreview();
                
                // Add a small delay to ensure all DOM changes are fully rendered
                setTimeout(() => {
                    const element = document.getElementById('resume-preview');
                    const opt = {
                        margin: 10,
                        filename: 'my_resume.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2 },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                    };
                    
                    if (typeof html2pdf !== 'undefined') {
                        html2pdf().set(opt).from(element).save();
                    } else {
                        alert('PDF generation library not loaded. Please try again.');
                    }
                }, 100); // 100ms delay
            });
        });
    </script>
</body>
</html>
