  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Inter', 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-dark: #090a0f;
            --bg-card: rgba(17, 19, 31, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.2);
            --secondary: #a855f7;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 20%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            background-attachment: fixed;
            min-height: 100vh;
        }

        /* Navigation Bar Styles */
        .navbar {
            background: rgba(9, 10, 15, 0.75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.8rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .navbar-brand i {
            margin-right: 10px;
            font-size: 1.7rem;
            color: var(--primary);
            -webkit-text-fill-color: initial;
        }

        .navbar-nav {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-item {
            margin: 0 0.5rem;
            position: relative;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-link i {
            margin-right: 8px;
        }

        .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Dropdown Menu Styles */
        .dropdown {
            position: relative;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #11131f;
            border: 1px solid var(--border-color);
            min-width: 200px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 0.5rem 0;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 1.2rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .dropdown-item i {
            margin-right: 8px;
            width: 16px;
            text-align: center;
            color: var(--primary);
        }

        .hamburger {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Main Content */
        .container {
            max-width: 1300px;
            margin: 2rem auto;
            padding: 0 20px;
            display: flex;
            gap: 30px;
        }

        .form-section {
            flex: 1.1;
            background-color: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .preview-section {
            flex: 0.9;
            background-color: rgba(10, 11, 18, 0.4);
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 20px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffffff 60%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-section > h2:first-of-type {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: #fff;
            outline: none;
            transition: all 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button.action-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
            filter: brightness(1.1);
        }

        .add-btn, .remove-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2) !important;
        }

        .add-btn:hover {
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35) !important;
        }

        .remove-btn {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2) !important;
        }

        .remove-btn:hover {
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.35) !important;
        }

        .download-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
        }

        /* Resume Preview Styles */
        .resume {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        #resume-preview {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 40px;
            width: 100%;
            max-width: 800px;
            min-height: 1000px;
            margin-top: 50px;
        }

        .resume-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .resume-header h2 {
            color: #2c3e50;
            border-bottom: none;
            margin: 5px 0;
            font-size: 24px;
            background: none;
            -webkit-background-clip: initial;
            -webkit-text-fill-color: initial;
        }

        .resume-header p {
            margin: 5px 0;
            color: #7f8c8d;
        }

        .resume-section {
            margin-bottom: 15px;
        }

        .resume-section h3 {
            color: #2c3e50;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .experience-item, .education-item, .certification-item, .achievement-item, .volunteer-item, .project-item {
            margin-bottom: 15px;
        }

        .job-title, .degree, .cert-name, .achievement-name, .volunteer-role, .project-name {
            font-weight: bold;
        }

        .company, .school, .cert-issuer, .achievement-issuer, .volunteer-org {
            font-style: italic;
        }

        .date {
            color: #7f8c8d;
            font-size: 14px;
        }

        .skills-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 14px;
        }

        .language-item {
            margin-bottom: 5px;
        }

        .cert-link {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }

        .cert-link:hover {
            text-decoration: underline;
        }

        .technologies-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0;
        }

        .technology {
            background-color: var(--secondary);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
        }

        .project-role {
            font-style: italic;
            color: #555;
            margin: 5px 0;
        }

        /* Footer */
        footer {
            background-color: #050608;
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
            border-top: 1px solid var(--border-color);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .container {
                flex-direction: column;
            }
            
            .download-btn {
                position: static;
                margin-top: 10px;
                width: 100%;
            }

            .form-section, .preview-section {
                max-height: initial;
            }
        }

        @media (max-width: 768px) {
            .navbar-nav {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background-color: #090a0f;
                border-top: 1px solid var(--border-color);
                padding: 1rem;
                box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            }
            
            .navbar-nav.active {
                display: flex;
            }
            
            .nav-item {
                margin: 0.5rem 0;
            }
            
            .dropdown-menu {
                position: static;
                opacity: 1;
                visibility: visible;
                transform: none;
                box-shadow: none;
                background-color: rgba(255, 255, 255, 0.05);
                margin-top: 0.5rem;
                border-radius: 8px;
            }
            
            .dropdown-item {
                color: var(--text-muted);
                padding: 0.5rem 1rem;
            }
            
            .dropdown-item:hover {
                color: white;
            }
            
            .hamburger {
                display: block;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="form-section">
            <h2>Languages</h2>
            <div id="languages-container">
                <div class="language-form">
                    <div class="form-group">
                        <label for="language1">Language</label>
                        <input type="text" id="language1" placeholder="English">
                    </div>
                    <div class="form-group">
                        <label for="proficiency1">Proficiency Level</label>
                        <select id="proficiency1">
                            <option value="">Select Proficiency</option>
                            <option value="Native">Native</option>
                            <option value="Fluent">Fluent</option>
                            <option value="Advanced">Advanced</option>
                            <option value="Intermediate">Intermediate</option>
                            <option value="Basic">Basic</option>
                        </select>
                    </div>
                </div>
            </div>
            <button class="add-btn action-btn" id="add-language">Add Another Language</button>

            <h2>Personal Information</h2>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="John Doe">
            </div>
             
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" placeholder="(123) 456-7890">
            </div>
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" placeholder="123 Main St, City, Country">
            </div>
            <div class="form-group">
                <label for="linkedin">LinkedIn Profile</label>
                <input type="url" id="linkedin" placeholder="https://linkedin.com/in/yourprofile">
            </div>
            <div class="form-group">
                <label for="github">GitHub Profile</label>
                <input type="url" id="github" placeholder="https://github.com/yourusername">
            </div>

            <h2>Professional Summary</h2>
            <div class="form-group">
                <textarea id="summary" placeholder="Experienced professional with skills in..."></textarea>
            </div>

            <h2>Work Experience</h2>
            <div id="experience-container">
                <div class="experience-form">
                    <div class="form-group">
                        <label for="jobTitle1">Job Title</label>
                        <input type="text" id="jobTitle1" placeholder="Software Developer">
                    </div>
                    <div class="form-group">
                        <label for="company1">Company</label>
                        <input type="text" id="company1" placeholder="Tech Inc.">
                    </div>
                    <div class="form-group">
                        <label for="jobStartDate1">Start Date</label>
                        <input type="text" id="jobStartDate1" placeholder="June 2020">
                    </div>
                    <div class="form-group">
                        <label for="jobEndDate1">End Date</label>
                        <input type="text" id="jobEndDate1" placeholder="Present">
                    </div>
                    <div class="form-group">
                        <label for="jobDescription1">Description</label>
                        <textarea id="jobDescription1" placeholder="Responsibilities and achievements..."></textarea>
                    </div>
                </div>
            </div>
            <button class="add-btn action-btn" id="add-experience">Add Another Experience</button>

            <h2>Education</h2>
            <div id="education-container">
                <div class="education-form">
                    <div class="form-group">
                        <label for="degree1">Degree</label>
                        <select id="degree1">
                            <option value="">Select Degree</option>
                            <option value="Bachelor of Technology (B.Tech)">Bachelor of Technology (B.Tech)</option>
                            <option value="Master of Technology (M.Tech)">Master of Technology (M.Tech)</option>
                            <option value="Bachelor of Engineering (B.E.)">Bachelor of Engineering (B.E.)</option>
                            <option value="Master of Engineering (M.E.)">Master of Engineering (M.E.)</option>
                            <option value="Bachelor of Science (B.Sc)">Bachelor of Science (B.Sc)</option>
                            <option value="Master of Science (M.Sc)">Master of Science (M.Sc)</option>
                            <option value="Bachelor of Computer Applications (BCA)">Bachelor of Computer Applications (BCA)</option>
                            <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                            <option value="Bachelor of Business Administration (BBA)">Bachelor of Business Administration (BBA)</option>
                            <option value="Master of Business Administration (MBA)">Master of Business Administration (MBA)</option>
                            <option value="Bachelor of Commerce (B.Com)">Bachelor of Commerce (B.Com)</option>
                            <option value="Master of Commerce (M.Com)">Master of Commerce (M.Com)</option>

                    </div>

                            <option value="Business Administration">Business Administration</option>
                            <option value="Economics">Economics</option>
                            <option value="Finance">Finance</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Human Resources">Human Resources</option>
                            <option value="Accounting">Accounting</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Physics">Physics</option>
                            <option value="Chemistry">Chemistry</option>

                    </div>
                    <div class="form-group" id="other-field-container" style="display: none;">

                    </div>
                    <div class="form-group">

                            <option value="Baroda College of Pharmacy">Baroda College of Pharmacy</option>
                            <option value="Other">Other (Please specify)</option>
                        </select>
                    </div>
                    <div class="form-group" id="other-school-container" style="display: none;">
                        <label for="otherSchool1">Other School/College Name</label>
                        <input type="text" id="otherSchool1" placeholder="Enter school/college name">
                    </div>
                    <div class="form-group">
                        <label for="educationStartDate1">Start Date</label>
                        <input type="text" id="educationStartDate1" placeholder="September 2016">
                    </div>
                    <div class="form-group">
                        <label for="educationEndDate1">End Date</label>
                        <input type="text" id="educationEndDate1" placeholder="May 2020">
                    </div>
                </div>
            </div>
            <button class="add-btn action-btn" id="add-education">Add Another Education</button>

            <h2>Certifications</h2>
            <div id="certifications-container">
                <div class="certification-form">
                    <div class="form-group">
                        <label for="certificationName1">Certification Name</label>
                        <input type="text" id="certificationName1" placeholder="AWS Certified Solutions Architect">
                    </div>
                    <div class="form-group">
                        <label for="certificationIssuer1">Issuing Organization</label>
                        <input type="text" id="certificationIssuer1" placeholder="Amazon Web Services">
                    </div>
                    <div class="form-group">
                        <label for="certificationDate1">Date Earned</label>
                        <input type="text" id="certificationDate1" placeholder="June 2023">

            // Certifications
            let certificationsHTML = '';
            for (let i = 1; i <= certificationCount; i++) {
                if (!document.getElementById(`certificationName${i}`)) continue;
                
                const certName = document.getElementById(`certificationName${i}`).value;
                const certIssuer = document.getElementById(`certificationIssuer${i}`).value;
                const certDate = document.getElementById(`certificationDate${i}`).value;
                const certLink = document.getElementById(`certificationLink${i}`).value;
                
                if (certName) {
                    let linkHTML = '';
                    if (certLink) {
                        if (certLink.startsWith('http')) {
                            linkHTML = `<div><a href="${certLink}" target="_blank" class="cert-link">Verify Certification</a></div>`;
                        } else {
                            linkHTML = `<div class="cert-link">License ID: ${certLink}</div>`;
                        }
                    }
                    
                    certificationsHTML += `
                        <div class="certification-item">
                            <div class="cert-name"><strong>${certName}</strong></div>
                            <div class="cert-issuer">${certIssuer}</div>
                            <div class="cert-date">${certDate}</div>
                            ${linkHTML}
                        </div>
                    `;
                }
            }
            
            // Achievements
            let achievementsHTML = '';
            for (let i = 1; i <= achievementCount; i++) {
                if (!document.getElementById(`achievement${i}`)) continue;
                
                const achievement = document.getElementById(`achievement${i}`).value;
                const achievementIssuer = document.getElementById(`achievementIssuer${i}`).value;
                const achievementDate = document.getElementById(`achievementDate${i}`).value;
                const achievementDesc = document.getElementById(`achievementDescription${i}`).value;
                
                if (achievement) {
                    achievementsHTML += `
                        <div class="achievement-item">
                            <div class="achievement-name"><strong>${achievement}</strong></div>
                            <div class="achievement-issuer">${achievementIssuer} | ${achievementDate}</div>
                            <div class="achievement-description">${achievementDesc}</div>
                        </div>
                    `;
                }
            }
            
            // Skills
            let skillsHTML = '';
            for (let i = 1; i <= skillCount; i++) {
                if (!document.getElementById(`skill${i}`)) continue;
                
                const skill = document.getElementById(`skill${i}`).value;
                if (skill) {
                    skillsHTML += `<span class="skill">${skill}</span>`;
                }
            }
            
            // Projects
            let projectsHTML = '';
            for (let i = 1; i <= projectCount; i++) {
                if (!document.getElementById(`projectName${i}`)) continue;
                
                const projectName = document.getElementById(`projectName${i}`).value || 'Project Name';
                const projectDescription = document.getElementById(`projectDescription${i}`).value || 'Project description...';
                const projectTechnologies = document.getElementById(`projectTechnologies${i}`).value;
                const projectRole = document.getElementById(`projectRole${i}`).value;
                
                let technologiesHTML = '';
                if (projectTechnologies) {
                    const techArray = projectTechnologies.split(',').map(tech => tech.trim());
                    technologiesHTML = `
                        <div class="technologies-list">
                            ${techArray.map(tech => `<span class="technology">${tech}</span>`).join('')}
                        </div>
                    `;
                }
                
                let roleHTML = '';
                if (projectRole) {
                    roleHTML = `<div class="project-role"><strong>Role:</strong> ${projectRole}</div>`;
                }
                
                projectsHTML += `
                    <div class="project-item">
                        <div class="project-name"><strong>${projectName}</strong></div>
                        ${technologiesHTML}
                        ${roleHTML}
                        <div class="project-description">${projectDescription}</div>
                    </div>
                `;
            }
            
            // Social Links
            let socialLinksHTML = '';
            if (linkedin) {
                socialLinksHTML += `<a href="${linkedin}" target="_blank">LinkedIn</a> | `;
            }
            if (github) {
                socialLinksHTML += `<a href="${github}" target="_blank">GitHub</a>`;
            }
            
            // Build the resume preview
            resumePreview.innerHTML = `
                <div class="resume-header">
                    <h2>${fullName}</h2>
                    <p>${address} | ${phone} | ${email}</p>
                    ${socialLinksHTML ? `<p>${socialLinksHTML}</p>` : ''}
                </div>
                
                <div class="resume-section">
                    <h3>Professional Summary</h3>
                    <p>${summary}</p>
                </div>
                
                ${languagesHTML ? `
                <div class="resume-section">
                    <h3>Languages</h3>
                    ${languagesHTML}
                </div>
                ` : ''}
                
                ${experiencesHTML ? `
                <div class="resume-section">
                    <h3>Work Experience</h3>
                    ${experiencesHTML}
                </div>
                ` : ''}
                
                ${educationHTML ? `
                <div class="resume-section">
                    <h3>Education</h3>
                    ${educationHTML}
                </div>
                ` : ''}
                
                ${certificationsHTML ? `
                <div class="resume-section">
                    <h3>Certifications</h3>
                    ${certificationsHTML}
                </div>
                ` : ''}
                
                ${achievementsHTML ? `
                <div class="resume-section">
                    <h3>Achievements & Awards</h3>
                    ${achievementsHTML}
                </div>
                ` : ''}
                
                ${skillsHTML ? `
                <div class="resume-section">
                    <h3>Skills</h3>
                    <div class="skills-list">
                        ${skillsHTML}
                    </div>
                </div>
                ` : ''}
                
                ${projectsHTML ? `
                <div class="resume-section">
                    <h3>Projects</h3>
                    ${projectsHTML}
                </div>
                ` : ''}
            `;
        }
    </script>
</body>
</html>
